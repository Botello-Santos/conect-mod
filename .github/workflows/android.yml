name: APK Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release donde subir los APK (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${TAG#v}"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/estudiantes/release/app-estudiantes-release.apk salida/conect-mod-estudiantes.apk
          cp android/app/build/outputs/apk/docentes/release/app-docentes-release.apk salida/conect-mod-docentes.apk
          ls -l salida

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: salida/*.apk

      - name: Subir al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" salida/*.apk --clobber
